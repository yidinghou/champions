<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCTS explorer</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc; --track: #ecebe5;
    --me: #5b43c7; --foe: #c2335a; --good: #2f9e5b; --warn: #d9a21b; --bad: #d4571b; --red: #d03b3b;
    --me-soft: rgba(91,67,199,.10); --foe-soft: rgba(194,51,90,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a9993; --line: #34332f; --track: #2c2b28;
      --me: #9b8cf5; --foe: #f0698f; --good: #54c283; --warn: #e0b84a; --bad: #f0a05a; --red: #e5534b;
      --me-soft: rgba(155,140,245,.16); --foe-soft: rgba(240,105,143,.16);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 64px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 12px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .sub { color: var(--muted); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px;
          --halo: var(--panel); }    /* --halo: the gap colour around a target wire, matching what is behind it */
  .tag { font-size: 12px; color: var(--muted); }

  /* turn strip */
  .strip { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .strip button { width: 34px; height: 34px; padding: 0; border-radius: 8px; font-size: 12px; font-weight: 600;
                  border: 2px solid transparent; color: #fff; cursor: pointer; }
  .strip button.cur { border-color: var(--ink); }
  .strip .lbl { font-size: 12px; color: var(--muted); margin-right: 4px; }

  /* chips */
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 13px;
          font-weight: 600; color: #fff; white-space: nowrap; vertical-align: middle; line-height: 1.5; }
  .chip.mon { background: var(--track); color: var(--ink); padding: 2px 9px 2px 3px; }
  .chip.mon.me { background: var(--me); color: #fff; } .chip.mon.foe { background: var(--foe); color: #fff; }
  @media (prefers-color-scheme: dark) { .chip.mon.me, .chip.mon.foe { color: #151514; } }
  .chip.mon img, .mon-card img { width: 28px; height: 28px; image-rendering: pixelated; }
  .chip.mon img { background: rgba(255,255,255,.9); border-radius: 50%; }
  .chip.mon.mini { font-size: 12px; padding: 1px 8px 1px 2px; } .chip.mon.mini img { width: 22px; height: 22px; }
  .chip.mon.mini.nosprite { padding: 1px 8px; }
  .chip.type { font-size: 11px; padding: 0 7px 0 4px; gap: 3px; text-transform: uppercase; letter-spacing: .04em; }
  .chip.type img { width: 11px; height: 11px; }
  /* a move sits on a type-coloured arrow from its user to its target (no arrow when it has no target to show) */
  .mv { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .mv .ico { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--ty);
             display: inline-flex; align-items: center; justify-content: center; }
  .mv .ico img { width: 12px; height: 12px; }
  .mv .cat { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .03em; }
  .mv.to { position: relative; padding: 0 4px 2px; border-bottom: 2px solid var(--ty); margin: 0 8px 0 2px; }
  .mv.to::after { content: ''; position: absolute; right: -8px; bottom: -6px;
                  border: 5px solid transparent; border-right: 0; border-left: 8px solid var(--ty); }
  .slot { display: flex; gap: 4px; align-items: center; height: 30px; white-space: nowrap; }
  .mv.line, .mv.plain { padding: 0 4px; margin-left: 2px; }
  /* an option's targets: its user rows, then the other side's active Pokémon in board order, joined by SVG wires */
  .tgtrow { position: relative; display: flex; align-items: center; flex: 1; min-width: 0; }
  .users, .tcol { display: flex; flex-direction: column; gap: 18px; }
  .tcol { align-items: flex-start; } .tcol > span { height: 30px; display: flex; align-items: center; }
  .tcol .idle { opacity: .6; }
  .lane { flex: 1; min-width: 40px; }
  svg.wires { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .swap { display: inline-flex; flex-direction: column; font-size: 10px; line-height: 9px; color: var(--muted); margin: 0 2px; }

  /* boards */
  .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .boards { grid-template-columns: 1fr; } }
  .side-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .side-title.me { color: var(--me); } .side-title.foe { color: var(--foe); }
  .mon-card { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: start; padding: 6px 8px; border-radius: 10px;
              margin-bottom: 6px; border: 1px solid var(--line); }
  .mon-card.active.me { background: var(--me-soft); border-color: var(--me); }
  .mon-card.active.foe { background: var(--foe-soft); border-color: var(--foe); }
  .mon-card.bench { opacity: .6; }
  .mon-card.fainted { opacity: .35; filter: grayscale(1); }
  .mon-card img { width: 34px; height: 34px; }
  .mon-card > img { margin-top: 2px; }
  .mon-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; }
  .mon-top b { font-weight: 650; }
  .abil { font-size: 11px; color: var(--muted); font-weight: 500; }
  .mset { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 14px; margin-top: 6px; }
  .mrow { display: flex; align-items: center; gap: 6px; height: 22px; min-width: 0; }
  .pp { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 9px; border-radius: 5px; background: var(--track); overflow: hidden; position: relative; margin-top: 3px; }
  .bar i { display: block; height: 100%; }
  .bar i.ghost { position: absolute; left: 0; top: 0; background: var(--bad); opacity: .45; }
  .bar.mini { height: 6px; width: 70px; display: inline-block; margin: 0 0 1px 6px; vertical-align: middle; }
  .hp { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status { font-size: 10px; padding: 0 6px; border-radius: 4px; background: var(--warn); color: #fff; font-weight: 700; }

  /* picks */
  .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .picks { grid-template-columns: 1fr; } }
  .opt { padding: 10px 8px; }
  .optrow { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .pct { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; }
  .val { display: inline-block; padding: 1px 8px; border-radius: 6px; font-weight: 700; font-size: 13px; color: #fff; }

  /* what happened */
  .step { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; padding: 7px 10px; border-radius: 10px;
          margin-bottom: 6px; border-left: 4px solid var(--line); background: var(--track); }
  .step.me { border-left-color: var(--me); } .step.foe { border-left-color: var(--foe); }
  .step.faint { background: transparent; border-left-style: dashed; color: var(--muted); }
  .step.note { background: transparent; padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .dmg { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--bad); }
  .dmg small { font-weight: 600; color: var(--muted); }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 5px; color: #fff; }
  .badge.ko { background: #b22; } .badge.immune, .badge.protected, .badge.missed, .badge.blocked { background: #7a7a75; }
  .badge.crit { background: var(--warn); }
  .target { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  details { margin-top: 8px; } summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  pre.log { margin: 6px 0 0; white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); }
  .verdict { font-weight: 700; } .win { color: var(--good); } .loss { color: var(--bad); }

  /* expected score of each pairing: Player 1's options down the side, Player 2's across the top, each row / column
     as big as its share of the mix but never smaller than its label; and a bar under each option */
  .hy-wrap { overflow-x: auto; padding: 0 5px 5px 0; }          /* the padding holds the end dividers and the outline */
  .hybrid { display: grid; gap: 7px; width: max-content; max-width: 100%;
            --divider: color-mix(in srgb, var(--ink) 24%, transparent); }
  .hy-title { font-size: 13px; font-weight: 700; padding: 6px 8px 0; white-space: nowrap; }
  .hy-title.me { color: var(--me); align-self: end; padding-bottom: 6px; } .hy-title.foe { color: var(--foe); }
  .hy-title .tag { font-weight: 500; }
  .hy-ch { align-self: end; padding: 2px 4px 6px; border-radius: 8px; cursor: pointer; }
  .hy-rh { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px; border-radius: 8px; cursor: pointer; }
  .hy-rh:hover, .hy-ch:hover { background: var(--track); }
  .hy-rh.pin, .hy-rh.pin:hover { background: var(--me-soft); box-shadow: inset 3px 0 0 var(--me); }
  .hy-ch.pin, .hy-ch.pin:hover { background: var(--foe-soft); box-shadow: inset 0 -3px 0 var(--foe); }
  .hybrid.focusing .hy-cell:not(.lit) { opacity: .28; }
  .hy-ch .p, .hy-rh .p { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .hy-ch.dim, .hy-rh.dim { opacity: .55; }
  .hy-cell { min-width: 58px; min-height: 36px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center;
             justify-content: center; font-weight: 700; font-size: 13px; color: var(--ink); transition: opacity .12s; }
  .hy-cell.strong { color: #fff; }
  .hy-cell.untried { color: var(--muted); font-weight: 500; background: repeating-linear-gradient(45deg, var(--track) 0 6px, transparent 6px 12px); }
  .hy-cell.click { cursor: pointer; } .hy-cell.click:hover { box-shadow: inset 0 0 0 2px var(--ink); }
  .hy-cell.played { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* dividers: 1px, centred in the 7px gap before (or, for .end, after) their track */
  .hy-vl, .hy-hl { pointer-events: none; border: 0 solid var(--divider); }
  .hy-vl { border-left-width: 1px; margin-left: -4px; } .hy-vl.end { border-left-width: 0; border-right-width: 1px; margin: 0 -4px 0 0; }
  .hy-hl { border-top-width: 1px; margin-top: -4px; } .hy-hl.end { border-top-width: 0; border-bottom-width: 1px; margin: 0 0 -4px 0; }
  .hybrid.narrow .hy-ch .mini-slot { flex-wrap: wrap; height: auto; min-height: 19px; }
  /* fold arrows: Player 2's options under 5% open to the right of its row, Player 1's below its column */
  .hy-more { font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 8px; background: var(--panel);
             display: inline-flex; align-items: center; justify-content: center; gap: 4px; line-height: 1.2; white-space: nowrap; }
  .hy-more .arr { font-size: 15px; font-weight: 700; }
  .hy-more.c { flex-direction: column; gap: 1px; align-self: center; padding: 5px 6px; margin: 0 6px 0 0; text-align: center;
               color: var(--foe); border: 1.5px solid var(--foe); }
  .hy-more.r { justify-self: center; padding: 2px 10px; margin: 0 0 6px; color: var(--me); border: 1.5px solid var(--me); }
  .hy-more.c:hover { background: color-mix(in srgb, var(--foe) 18%, var(--panel)); }
  .hy-more.r:hover { background: color-mix(in srgb, var(--me) 18%, var(--panel)); }
  .mini-slot { display: flex; align-items: center; gap: 3px; font-size: 11px; white-space: nowrap; height: 19px; }
  .mini-slot .g { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .mini-slot img { width: 18px; height: 18px; image-rendering: pixelated; }
  .mini-slot .g + .g { margin-left: 1px; }
  .mini-slot img.sd { background: rgba(255,255,255,.9); border-radius: 50%; box-shadow: 0 0 0 2px var(--me); margin: 0 1px; }
  .mini-slot img.sd.foe { box-shadow: 0 0 0 2px var(--foe); }
  .mini-slot .ico { width: 13px; height: 13px; border-radius: 50%; background: var(--ty); display: inline-flex; align-items: center; justify-content: center; }
  .mini-slot .ico img { width: 9px; height: 9px; }
  .mini-slot .to { color: var(--muted); }
  .scale-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin: 0 0 8px; }
  .scale-row label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; color: var(--ink); font-size: 12px; }
  .legend { display: inline-flex; align-items: center; gap: 8px; }
  .legend .grad { width: 200px; height: 10px; border-radius: 5px; border: 1px solid var(--line); }
  .hatch { display: inline-block; width: 22px; height: 12px; border-radius: 3px; vertical-align: middle; border: 1px solid var(--line);
           background: repeating-linear-gradient(45deg, var(--track) 0 4px, transparent 4px 8px); }
  .ev-bar { position: relative; height: 8px; border-radius: 4px; background: var(--track); margin-top: 4px; }
  .ev-bar::before { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
  .ev-bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .ev-txt { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .ev-txt b { color: var(--ink); }
  /* an option drawn in full: floating by a hovered grid header, or pinned under the grid (one per player) */
  .optpop { position: absolute; z-index: 10; display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
         padding: 10px 12px 8px; box-shadow: 0 10px 30px rgba(0,0,0,.18); pointer-events: none; width: 440px; max-width: 94vw; --halo: var(--panel); }
  .optpop.on { display: block; }
  .optpop .opt { padding: 2px 0 0; }
  .optpop .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .pinned { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .pinned .empty { font-size: 12px; color: var(--muted); padding: 10px 8px; }
  .together { font-size: 12px; color: var(--muted); margin: 8px 8px 0; }
  .together b { color: var(--ink); }

  /* explorer */
  .strip .crumb { width: auto; padding: 0 12px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .strip .crumb.cur { border: 2px solid var(--ink); }
  .crumb-pair { font-size: 11px; color: var(--muted); margin: 0 4px; max-width: 360px; }
  .explore-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .explore-bar button { font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--ink);
                        background: var(--ink); color: var(--panel); cursor: pointer; }
  .explore-bar button:disabled { opacity: .45; cursor: default; }
  .explore-bar input { width: 64px; font: inherit; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line);
                       background: var(--panel); color: var(--ink); }
  .err { color: var(--bad); font-size: 13px; font-weight: 600; }

  /* how we got here: the turn played out on a battle field (steps and boards from server.py turn_steps) */
  .anim { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; margin-top: 8px; }
  @media (max-width: 900px) { .anim { grid-template-columns: minmax(0, 1fr); } }
  .steps .step { cursor: pointer; transition: opacity .2s; }
  .steps .step.future { opacity: .38; } .steps .step.cur { box-shadow: 0 0 0 2px var(--ink); }
  .step .num { font-size: 11px; font-weight: 700; color: var(--muted); width: 14px; }
  .bs { font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px; color: #fff; background: var(--bad); }
  .bs.up { background: var(--good); }
  .pop { position: absolute; left: 50%; top: 4px; font-weight: 800; font-size: 16px; pointer-events: none; white-space: nowrap;
         opacity: 0; z-index: 3; text-shadow: 0 0 3px var(--panel), 0 0 3px var(--panel), 0 0 3px var(--panel); }
  .pop.dmg { color: var(--bad); } .pop.out { color: var(--muted); font-size: 13px; } .pop.up { color: var(--good); font-size: 13px; }
  .pop.down { color: var(--bad); font-size: 13px; }
  svg.ov { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 2; }
  .fd { position: relative; height: 390px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
        background: linear-gradient(180deg, color-mix(in srgb, var(--foe) 9%, var(--panel)), var(--panel) 50%, color-mix(in srgb, var(--me) 9%, var(--panel))); }
  .fd .row { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 90px; }
  .fd .row.foe { top: 22px; } .fd .row.me { bottom: 22px; }
  .fslot { width: 172px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .fslot.me { --sidec: var(--me); } .fslot.foe { --sidec: var(--foe); }
  .fslot .plate { width: 100%; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--sidec);
                  border-radius: 8px; padding: 3px 8px 5px; font-size: 12px; }
  .fslot .plate .top { display: flex; justify-content: space-between; gap: 4px; align-items: center; }
  .fslot .plate .top > span:first-child { display: inline-flex; gap: 4px; align-items: center; }
  .fslot .spw { position: relative; width: 88px; height: 88px; }
  .fslot .spw::before { content: ''; position: absolute; left: 6px; right: 6px; bottom: 4px; height: 14px; border-radius: 50%;
                        background: color-mix(in srgb, var(--sidec) 22%, transparent); }
  .fslot img.spr { position: relative; width: 88px; height: 88px; image-rendering: pixelated; }
  .hpb { height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; position: relative; margin-top: 3px; }
  .hpb i { position: absolute; left: 0; top: 0; bottom: 0; } .hpb .lag { background: var(--bad); opacity: .85; }
  .fd .bench { position: absolute; display: flex; gap: 6px; z-index: 1; }
  .fd .bench.foe { top: 10px; right: 12px; } .fd .bench.me { bottom: 10px; left: 12px; }
  .fd .bench .lab { font-size: 10px; color: var(--muted); align-self: center; }
  .bmini { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px 4px; border-radius: 8px;
           background: var(--panel); border: 1px solid var(--line); }
  .bmini img { width: 28px; height: 28px; image-rendering: pixelated; }
  .bmini .mb { width: 28px; height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
  .bmini .mb i { display: block; height: 100%; }
  .bmini.down { opacity: .35; filter: grayscale(1); }
  .banner { margin-top: 10px; min-height: 46px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px;
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; font-weight: 600; }
  .banner .n { font-size: 11px; color: var(--muted); font-weight: 700; margin-right: 4px; }
  .player { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .player .ctl { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
                 color: var(--ink); cursor: pointer; font-size: 12px; padding: 0; }
  .player .ctl.play { width: 44px; background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .player .ends { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .player .pos { font-size: 12px; color: var(--muted); min-width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
  .scrub { flex: 1; height: 24px; display: flex; gap: 2px; cursor: pointer; user-select: none; touch-action: none; }
  .scrub .sg { position: relative; height: 100%; border-radius: 5px; background: var(--track); overflow: hidden; }
  .scrub .sg i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--sc); opacity: .5; }
  .scrub .sg.me { --sc: var(--me); } .scrub .sg.foe { --sc: var(--foe); }
  .scrub .sg span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                    font-size: 10px; font-weight: 700; color: var(--ink); }
  .speeds { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .speeds button { font: inherit; font-size: 11px; padding: 4px 7px; border: 0; background: var(--panel); color: var(--ink); cursor: pointer; }
  .speeds button.on { background: var(--ink); color: var(--panel); font-weight: 700; }
  /* the pairing preview window */
  dialog#preview { width: min(1080px, 96vw); max-height: 94vh; border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px;
                   background: var(--panel); color: var(--ink); --halo: var(--panel); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  dialog#preview::backdrop { background: rgba(20,20,18,.5); }
  .pv-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .pv-head h2 { margin: 0; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); }

  .explore-bar button.ghost { background: var(--panel); color: var(--ink); border-color: var(--line); }

  /* the set editor: a board card opens its set in a window; edits wait in the bar above the board until applied */
  .btn { font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--ink);

  .chg { display: inline-flex; align-items: center; gap: 2px; padding: 1px 3px 1px 9px; border-radius: 999px; font-size: 12px;

  dialog#ed { width: min(1040px, 96vw); height: min(680px, 92vh); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px;
              background: var(--panel); color: var(--ink); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  dialog#ed[open] { display: flex; flex-direction: column; gap: 10px; }
  dialog#ed::backdrop { background: rgba(20,20,18,.5); }
  #ed .pv-head h2 { display: flex; align-items: center; gap: 8px; font-size: 15px; }

  #ed .slotb { font-size: 13px; display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 8px; min-height: 36px; flex-wrap: wrap;
               border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }

  #ed .slotb .pp + .roll, #ed .slotb .badtag + .roll { margin-left: 0; }

  #ed .bh { padding: 9px 12px 2px; font-size: 13px; } #ed .bh .tag { margin-left: 6px; }
  #ed .src { padding: 0 12px; font-size: 11px; color: var(--muted); }
  #ed .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 6px 12px 9px; border-bottom: 1px solid var(--line); }
  #ed .filters select { font: inherit; font-size: 12px; padding: 3px 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  #ed input.q { flex: 1; font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line);
                background: var(--bg); color: var(--ink); min-width: 0; }

  #ed .row.mvrow { grid-template-columns: 200px 64px 34px 40px minmax(0, 1fr) auto; }
  #ed .row.sprow { grid-template-columns: 28px 104px 132px 64px 30px minmax(0, 1fr) auto; }
  #ed .row.abrow, #ed .row.itrow { grid-template-columns: 150px 64px minmax(0, 1fr) auto; }
  #ed .row.sprd { grid-template-columns: 220px 64px minmax(0, 1fr); }
  #ed .row.hi { background: var(--track); }
  #ed .row.now { box-shadow: inset 3px 0 0 var(--ink); }

  #ed .row .tag { font-size: 11px; white-space: nowrap; }

  #ed .use { position: relative; height: 16px; border-radius: 4px; background: var(--track); overflow: hidden; }
  #ed .use i { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--me) 35%, transparent); }
  #ed .use b { position: relative; display: block; text-align: right; padding-right: 4px; font-size: 10px; line-height: 16px; font-variant-numeric: tabular-nums; }
  #ed .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }

  #ed .seg button + button { border-left: 1px solid var(--line); }
  #ed .seg button.on { background: var(--ink); color: var(--panel); }

  #ed .tys button { width: 22px; height: 22px; border-radius: 50%; background: var(--ty); border: 2px solid transparent; padding: 0; cursor: pointer;
                    display: inline-flex; align-items: center; justify-content: center; }
  #ed .tys button img { width: 12px; height: 12px; }
  #ed .tys button.on { border-color: var(--ink); } #ed .tys.picked button:not(.on) { opacity: .3; }

  #ed .foot .chg { padding-right: 9px; }
</style></head>
<body>
<main>
  <div class="head"><h1>MCTS explorer</h1><span class="sub">both players MCTS · click a pairing to play it, then Analyze the state it leads to</span></div>
  <div class="strip" id="strip"></div>
  <div id="view"><div id="anim"></div><div id="rest"></div></div>
</main>
<dialog id="preview">
  <div class="pv-head"><h2 id="pv-title"></h2><button class="pv-x" onclick="$('#preview').close()" title="close (Esc)">×</button></div>
  <p class="tag" id="pv-sub"></p>
  <div id="pv-body"></div>
  <div class="pv-foot explore-bar"><span class="tag" id="pv-seed"></span><span class="err" id="pv-err"></span>
    <span style="flex:1"></span>
    <button id="pv-reroll" class="ghost" onclick="previewRoll()">Re-roll the luck</button>
    <button id="pv-go" onclick="previewGo()"></button></div>
</dialog>
<dialog id="ed"></dialog>
<div class="optpop" id="optpop"></div>
<script>
const D = __DATA__;
const TYPE = {normal:'#8a8a78',fire:'#e8602a',water:'#3b82e8',electric:'#e8b81a',grass:'#4aa83c',ice:'#4cb8c8',
  fighting:'#b8312b',poison:'#9a3fa8',ground:'#c9a24a',flying:'#7b8fe0',psychic:'#e8457a',bug:'#8aa31a',
  rock:'#a89438',ghost:'#6a4a8a',dragon:'#5b3fd8',dark:'#5a4a40',steel:'#8a8aa0',fairy:'#e883b4'};
const CAT = {physical:'PHY', special:'SPE', status:'STA'};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = x => (x * 100).toFixed(x < .1 ? 1 : 0) + '%';
const sc = (v) => `hsl(${Math.round(((v + 1) / 2) * 120)} 55% 42%)`;      // -1 red .. +1 green
const SIDE = ['me', 'foe'];
const PLAYER = ['Player 1', 'Player 2'];
const sideTitle = s => `${PLAYER[s]} <span class="tag">MCTS</span>`;
const num = v => (Math.abs(v) < .005 ? '0.00' : (v > 0 ? '+' : '') + v.toFixed(2));

// a species icon: embedded once a state has it, else served (the editor lists every species)
const ICON = new Set(D.catalog.species.filter(s => s.icon).map(s => s.id));
const spriteSrc = sp => D.sprites[sp] || (ICON.has(sp) ? `/icon/${sp}.png` : '');
const sprite = sp => (spriteSrc(sp) ? `<img src="${spriteSrc(sp)}" alt="">` : '');
const monChip = (name, sp, side, attr = '') => `<span class="chip mon ${SIDE[side]}" ${attr}>${sprite(sp)}${esc(name)}</span>`;
const tyIcon = ty => (D.typeicons[ty] ? `<img src="${D.typeicons[ty]}" alt="">` : '');
const typeChip = ty => `<span class="chip type" style="background:${TYPE[ty] || '#888'}">${tyIcon(ty)}${esc(ty)}</span>`;
const moveChip = (m, cls = '', attr = '') => `<span class="mv ${cls}" ${attr} style="--ty:${TYPE[m.type] || '#888'}" title="${esc(m.type)}">
  <span class="ico">${tyIcon(m.type)}</span>${esc(m.move)}<span class="cat">${CAT[m.cat] || ''}${m.bp ? ' ' + m.bp : ''}</span></span>`;

// One option: its user rows (board order), then a column of the other side's active Pokémon in board order. Each move
// wires from its right end to whoever it is aimed at (c.hits: [side, team index]); a wire to the partner U-turns back
// through the gap between the rows. Moves aimed at the user, its side or the field have no wire. drawWires() draws them.
function wiredCombo(combo, side, teams) {
  const foes = teams[1 - side].map((m, i) => ({...m, i})).filter(m => m.active && m.hp > 0);
  const here = new Set([...foes.map(m => 'f' + m.i), ...combo.map(c => 'u' + c.user)]), wires = [], hit = new Set();
  const rows = [...combo].sort((a, b) => a.user - b.user).map(c => {
    const u = `data-u="${c.user}"`;
    if (c.switch) return `<span class="slot">${monChip(c.mon, c.species, side, u)}<span class="swap"><span>&rarr;</span><span>&larr;</span></span>
      ${monChip(c.switch, c.to, side)}</span>`;
    const to = (c.hits || []).map(([s, i]) => (s === side ? 'u' : 'f') + i).filter(k => here.has(k) && k !== 'u' + c.user);
    to.forEach(k => hit.add(k));
    if (to.length) wires.push({u: c.user, color: TYPE[c.type] || '#888', to});
    return `<span class="slot">${monChip(c.mon, c.species, side, u)}${c.mega ? '<span class="badge crit">MEGA</span>' : ''}${
      moveChip(c, to.length ? 'line' : 'plain', `data-src="${c.user}"`)}</span>`;
  });
  const col = foes.map(m => `<span><span class="chip mon mini ${SIDE[1 - side]} ${hit.has('f' + m.i) ? '' : 'idle'}" data-dst="f${m.i}">${
    sprite(m.species)}${esc(m.name)}</span></span>`).join('');
  return `<div class="tgtrow" data-wires='${JSON.stringify(wires)}'><div class="users">${rows.join('')}</div>
    <div class="lane"></div><div class="tcol">${col}</div><svg class="wires"></svg></div>`;
}

function drawWires() {
  document.querySelectorAll('.tgtrow').forEach(row => {
    const R = row.getBoundingClientRect();
    const box = el => { const r = el.getBoundingClientRect();
      return {l: r.left - R.left, r: r.right - R.left, t: r.top - R.top, b: r.bottom - R.top, m: (r.top + r.bottom) / 2 - R.top}; };
    const at = sel => box(row.querySelector(sel)), src = w => at(`.mv[data-src="${w.u}"]`);
    const wires = JSON.parse(row.dataset.wires);
    const lines = [...row.querySelectorAll('.mv.line')].map(box);
    const xc = lines.length ? Math.max(...lines.map(b => b.r)) + 10 : 0;     // where every foe wire starts to bend
    // wires sharing a foe: the one level with it stays straight, the others land offset toward their own row
    const ends = {};
    wires.forEach(w => w.to.forEach(k => { if (k[0] === 'f') (ends[k] = ends[k] || []).push({w, y0: src(w).m}); }));
    Object.entries(ends).forEach(([k, arr]) => {
      const t = at(`[data-dst="${k}"]`), lim = Math.min(9, (t.b - t.t) / 2 - 2);
      const want = g => t.m + (arr.length > 1 ? Math.max(-lim, Math.min(lim, (g.y0 - t.m) * .3)) : 0);
      arr.sort((a, b) => a.y0 - b.y0);
      let a = 0;
      arr.forEach((g, i) => { if (Math.abs(g.y0 - t.m) < Math.abs(arr[a].y0 - t.m)) a = i; });
      arr[a].y1 = want(arr[a]);
      for (let i = a + 1; i < arr.length; i++) arr[i].y1 = Math.max(want(arr[i]), arr[i - 1].y1 + 8);
      for (let i = a - 1; i >= 0; i--) arr[i].y1 = Math.min(want(arr[i]), arr[i + 1].y1 - 8);
    });
    const head = (x, y, dx, dy, col) => {                // tip at (x, y), pointing along (dx, dy)
      const bx = x - dx * 8, by = y - dy * 8, px = -dy * 4.5, py = dx * 4.5;
      return `<path d="M${bx + px} ${by + py}L${x} ${y}L${bx - px} ${by - py}Z" fill="${col}"/>`;
    };
    let svg = '';
    // one group per move: its halos, then its strokes, so a spread move's fork never cuts itself but a later move's wire
    // visibly passes over an earlier one where they cross
    wires.forEach(w => {
      const paths = [], heads = [], s = src(w);
      w.to.forEach(k => {
        if (k[0] === 'f') {
          const t = at(`[data-dst="${k}"]`), y1 = ends[k].find(g => g.w === w).y1, x1 = t.l - 3, e = x1 - 7, h = Math.max(8, (e - xc) / 2);
          paths.push(`M${s.r + 2} ${s.m}H${xc}C${xc + h} ${s.m} ${e - h} ${y1} ${e} ${y1}`);
          heads.push([x1, y1, 1, 0]);
          return;
        }
        // the partner: U-turn off the move's right end, run back along the gap, turn into the partner's edge.
        // dir: which side of that edge the run sits (+1 = below it); the two directions turn in at different x
        const t = at(`[data-u="${k.slice(1)}"]`), up = t.m < s.m, dir = up ? 1 : -1;
        const tip = up ? t.b + 1 : t.t - 1, x1 = t.r - (up ? 14 : 32), sx = s.r + 2, sy = s.m;
        const run = tip + dir * 11, yb = tip + dir * 8, k2 = Math.abs(run - sy) * .67;
        paths.push(`M${sx} ${sy}H${sx + 3}C${sx + 3 + k2} ${sy} ${sx + 3 + k2} ${run} ${sx + 3} ${run}H${x1 + 3}Q${x1} ${run} ${x1} ${yb}`);
        heads.push([x1, tip, 0, -dir]);
      });
      svg += paths.map(d => `<path d="${d}" fill="none" style="stroke:var(--halo)" stroke-width="6"/>`).join('') +
             paths.map(d => `<path d="${d}" fill="none" stroke="${w.color}" stroke-width="2"/>`).join('') +
             heads.map(([x, y, dx, dy]) => head(x, y, dx, dy, w.color)).join('');
    });
    row.querySelector('svg.wires').innerHTML = svg;
  });
}

// T.table.cells[i][j]: MCTS's mean result (Player 1's view: +1 = Player 1 won every simulated game, -1 = Player 2 did)
// when Player 1 plays T.options[i] and Player 2 T.table.cols[j]; T.table.tries[i][j]: how many iterations tried that
// pair (0 = untried: the cell only holds the position's average).
const NEG = 'var(--red)', POS = 'var(--good)';   // not --bad: that's the orange damage colour
function evColor(v) {
  return `color-mix(in srgb, ${v < 0 ? NEG : POS} ${Math.round(Math.min(1, Math.abs(v)) * 100)}%, var(--panel))`;
}
const favours = v => (Math.abs(v) < .1 ? 'about even' : `favours Player ${v > 0 ? 1 : 2}`);
function vsBar(o, side) {                            // the option's expected score against the other side's mix
  const v = side === 0 ? o.score : -o.score;         // Player 2's options are scored from its own view
  const w = Math.min(1, Math.abs(v)) * 50;
  return `<div class="ev-bar"><i style="left:${v < 0 ? 50 - w : 50}%;width:${w}%;background:${evColor(v < 0 ? -1 : 1)}"></i></div>
    <div class="ev-txt">against ${PLAYER[1 - side]}'s mix: <b>${num(v)}</b> &middot; ${favours(v)}</div>`;
}
const SHORT = {'both foes': 'both', 'everyone else': 'all'};
// side: whose option this is; a target sprite carries its own side (c.target_side) for its ring, which is all it needs
// (no arrow). Each slot is two unbreakable groups (user + move, then target) so a narrow column can wrap it after the move
const ring = (sp, s) => (D.sprites[sp] ? `<img class="sd ${SIDE[s]}" src="${D.sprites[sp]}" alt="">` : '');
const miniCombo = (combo, side) => combo.map(c => `<div class="mini-slot">${c.switch
  ? `<span class="g">${ring(c.species, side)}<span class="to">&#8644;</span>${ring(c.to, side)}</span>`
  : `<span class="g">${ring(c.species, side)}<span class="ico" style="--ty:${TYPE[c.type] || '#888'}">${tyIcon(c.type)}</span>${esc(c.move)}</span>${c.target
    ? `<span class="g">${c.target_species && D.sprites[c.target_species] ? ring(c.target_species, c.target_side)
      : `<span class="to">&rarr; ${esc(SHORT[c.target] || c.target)}</span>`}</span>` : ''}`}</div>`).join('');
const comboText = combo => combo.map(c => c.switch ? `${c.mon} ⇄ ${c.switch}` : `${c.mon} ${c.move}${c.target ? ' → ' + c.target : ''}`).join(' + ');
// one line: the position's score, the iterations and the colour scale; the longer wording is in tooltips
function matrixHead(T) {
  return `<div class="scale-row"><span title="the position's expected score: +1 = Player 1 wins, &minus;1 = Player 2 wins"><b style="color:var(--me);font-size:12px">${
      PLAYER[0]}</b> ${val(T.value)}</span>
    <span>${T.iterations.toLocaleString()} iterations</span>
    <span class="legend" title="&minus;1 = Player 2 won every simulated game, +1 = Player 1 won every one"><span>&minus;1</span>
      <span class="grad" style="width:120px;background:linear-gradient(90deg, ${NEG}, var(--panel), ${POS})"></span><span>+1</span></span>
    <span><span class="hatch"></span> untried</span></div>`;
}
// The grid's rows: side titles, Player 2's options, one per shown Player 1 option (then its fold arrow); its columns:
// Player 1's options, one per shown Player 2 option (then its fold arrow). Options under CUT of their side's mix fold
// away, except the top 2 and the played one.
const CUT = .05, WEIGHT = .5, ROWS = 320, GOPEN = new Set();   // GOPEN: 'r' / 'c' = Player 1's / 2's folded options shown
function gridMore(k) { GOPEN.has(k) ? GOPEN.delete(k) : GOPEN.add(k); render(); }
function pickIdx(ps, played, k) {
  const all = ps.map((_, i) => i), main = all.filter(i => ps[i] >= CUT || i < 2 || i === played);
  return {shown: GOPEN.has(k) ? all : main, hid: all.filter(i => !main.includes(i))};
}
function cell(T, i, j, played, click) {
  const v = T.table.cells[i][j], n = T.table.tries[i][j], hit = !!played && played[0] === i && played[1] === j;
  const tip = `${comboText(T.options[i].combo)}  vs  ${comboText(T.table.cols[j].combo)}\n` +
    (n ? `${num(v)}: average of ${n} simulated game${n > 1 ? 's' : ''} starting with this pair` : 'MCTS never tried this pair');
  return {v, n, tip: esc(tip), cls: `${hit ? 'played' : ''} ${click ? 'click' : ''}`, on: click ? ` onclick="openPreview(${i}, ${j})"` : ''};
}
// played: [row, col] of the outlined cell (or null); click: cells are buttons that call openPreview(row, col);
// pin: [row, col] of the options drawn in full under the grid (either can be null); teams: the board they were chosen on.
// A header shows its option in full on hover (showOpt) and pins it on a click (pinOpt).
function gridCard(T, played, click, pin, teams) {
  const R = pickIdx(T.options.slice(0, T.table.cells.length).map(o => o.p), played ? played[0] : -1, 'r');
  const C = pickIdx(T.table.cols.map(c => c.p), played ? played[1] : -1, 'c');

  el.style.opacity = pop.o; el.style.transform = `translate(-50%, ${-pop.y * 14}px)`;

class Field {
  constructor(box) {
    this.box = box;
    const slot = (s, i) => {
      const plate = `<div class="plate"><div class="top"><span><b class="nm"></b><span class="st"></span><span class="bst"></span></span><span class="hp"></span></div>
        <div class="hpb"><i class="lag"></i><i class="fill"></i></div></div>`;
      const spr = `<div class="spw"><img class="spr" alt=""><span class="pop"></span></div>`;
      return `<div class="fslot ${SIDE[s]}" data-s="${s}" data-i="${i}">${s ? plate + spr : spr + plate}</div>`;
    };
    box.innerHTML = `<div class="fd"><div class="bench foe"></div><div class="row foe">${slot(1, 0)}${slot(1, 1)}</div>
      <div class="row me">${slot(0, 0)}${slot(0, 1)}</div><div class="bench me"></div><svg class="ov"></svg></div><div class="banner"></div>`;
    this.slots = [...box.querySelectorAll('.fslot')].map(e => {
      e._q = Object.fromEntries(['spr', 'spw', 'nm', 'st', 'bst', 'hp', 'fill', 'lag', 'pop', 'plate'].map(c => [c, e.querySelector('.' + c)]));
      return e; });
    this.key = null;
  }
  slotEl(mon, P) { return this.slots.find(e => +e.dataset.s === mon[0] && P.slots[mon[0]][+e.dataset.i] === mon[1]); }
  layout(A, P) {
    const root = this.box.querySelector('.fd'), svg = root.querySelector('svg');
    svg.innerHTML = '';
    const src = A && this.slotEl(A.src, P);
    if (!src) return null;
    const c = el => { const b = relBox(el._q.spw, root); return [b.cx, b.m]; };
    const [sx, sy] = c(src), side = A.src[0];
    const paths = A.dst.map(mon => this.slotEl(mon, P)).filter(Boolean).map(el => {
      const [tx, ty] = c(el);
      if (+el.dataset.s === side) {                        // the partner: an arc bowing toward the middle
        const bow = side ? 1 : -1, d = Math.sign(tx - sx);
        return `M${sx + d * 30} ${sy + bow * 26}Q${(sx + tx) / 2} ${sy + bow * 90} ${tx - d * 30} ${ty + bow * 26}`;
      }
      const dx = tx - sx, dy = ty - sy, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
      const ax = sx + ux * 42, ay = sy + uy * 42, bx = tx - ux * 44, by = ty - uy * 44;
      return `M${ax} ${ay}Q${(ax + bx) / 2 - uy * 30} ${(ay + by) / 2 + ux * 30} ${bx} ${by}`;
    });
    return paths.length ? wire(svg, paths, A.color) : null;
  }
  banner(T, k, t, ends) {
    if (t <= 0) return `<span class="n">${ends[0].toUpperCase()}</span><span class="tag">press play to watch the turn</span>`;
    const st = T.steps[k], S = T.boards[k], N = T.boards[k + 1], c = (mon, bd = N) => chipOf(bd, mon, true);
    const txt = {
      move: () => `${c(st.user)} used ${moveChip(st.move)}${st.notes.length ? ` <span class="tag">${esc(st.notes.join(' · '))}</span>` : ''}`,
      ability: () => `${st.mon ? c(st.mon) + "'s " : ''}${esc(title(st.ability))} <span class="tag">${st.boosts.map(([m, s, v]) => esc(N[m[0]][m[1]].name) + ' ' + boostTxt(s, v)).join(' · ')}</span>`,
      switch: () => st.replace || st.out == null ? `${PLAYER[st.side]} sent in ${c([st.side, st.in])}`
        : `${PLAYER[st.side]} withdrew ${c([st.side, st.out], S)} and sent in ${c([st.side, st.in])}`,
      faint: () => `${c(st.mon)} fainted!`,
      cant: () => `${c(st.mon)} couldn't move <span class="tag">${esc(st.why || '')}</span>`,
      residual: () => st.dmg ? `${c(st.mon)} is hurt${st.why ? ' by ' + esc(st.why) : ''}` : `${c(st.mon)} restored HP${st.why ? ' (' + esc(st.why) + ')' : ''}`,
      note: () => `${st.mon ? c(st.mon) : ''}<span>${esc(st.text)}</span>`,
    }[st.k] || (() => esc(st.k));
    return `<span class="n">${k + 1}/${T.steps.length}</span>${txt()}${t >= T.total ? ` <span class="n" style="margin-left:auto">${ends[1].toUpperCase()}</span>` : ''}`;
  }
  frame(T, k, p, P, t, ends) {
    const st = T.steps[k];
    for (const e of this.slots) {
      const s = +e.dataset.s, id = P.slots[s][+e.dataset.i];
      e.style.visibility = id == null ? 'hidden' : '';
      if (id == null) continue;
      const key = s + ',' + id, m = P[key], q = e._q, info = m.m;
      if (e._sp !== info.species) { e._sp = info.species; q.spr.src = D.sprites[info.species] || ''; }
      let ty = 26 * m.fade - 10 * m.hop, sc = 1, op = 1 - .8 * m.fade;
      if (st.k === 'switch' && st.side === s && id === st.out) { sc = 1 - .5 * m.leave; op *= 1 - m.leave; ty += (s ? -1 : 1) * 18 * m.leave; }
      if (st.k === 'switch' && st.side === s && id === st.in) { sc = .5 + .5 * m.enter; op = m.enter; }
      q.spr.style.transform = `translate(${Math.sin(p * 110) * 6 * m.shake}px, ${ty}px) scale(${sc})`;
      q.spr.style.opacity = op;
      q.spr.style.filter = `grayscale(${m.fade}) brightness(${1 + 1.4 * m.flash}) drop-shadow(0 0 ${10 * m.glow}px var(--sidec))`;
      q.plate.style.opacity = Math.max(op, .25);
      q.fill.style.width = (m.hp / info.max * 100) + '%'; q.fill.style.background = hpCol(m.hp / info.max);
      q.lag.style.width = (m.lag / info.max * 100) + '%';
      setHtml(q.nm, esc(info.name));
      setHtml(q.hp, `${Math.round(m.hp)}/${info.max}`);
      setHtml(q.st, m.status ? `<span class="status">${esc(m.status.toUpperCase())}</span>` : '');
      setHtml(q.bst, boostChips(m.boosts));
      setPop(q.pop, m.pop);
    }
    [0, 1].forEach(s => setHtml(this.box.querySelector(`.bench.${SIDE[s]}`), (s ? '' : '<span class="lab">bench</span>') +
      T.boards[k][s].map((_, i) => i).filter(i => !P.slots[s].includes(i)).map(i => {
        const m = P[s + ',' + i], f = m.hp / m.m.max;
        return `<span class="bmini ${m.fade >= 1 || m.hp <= 0 ? 'down' : ''}" title="${esc(m.m.name)}">${sprite(m.m.species)}<span class="mb"><i style="width:${f * 100}%;background:${hpCol(f)}"></i></span></span>`;
      }).join('') + (s ? '<span class="lab">bench</span>' : '')));
    if (this.key !== k) { this.key = k; this.wires = this.layout(arrowsOf(st), P); }
    if (this.wires) this.wires.set(P.draw);
    const banner = this.box.querySelector('.banner');
    setHtml(banner, this.banner(T, k, t, ends));
    banner.style.opacity = t <= 0 ? 1 : .35 + .65 * seg(p, 0, .08);
  }
}

function stepRow(T, st, i) {
  const S = T.boards[i], N = T.boards[i + 1], c = (mon, bd = N) => chipOf(bd, mon), mini = mon => chipOf(N, mon, true);
  const tags = a => a.map(x => `<span class="tag">${esc(x)}</span>`).join('');
  let body, cls = SIDE[stepSide(st)];
  if (st.k === 'move') {
    body = c(st.user) + moveChip(st.move, st.hits.length ? 'to' : '') + st.hits.map(h => {
      const m = N[h.mon[0]][h.mon[1]], f = m.hp / m.max;
      return `<span class="target">${mini(h.mon)}${h.dmg ? `<span class="dmg">&minus;${h.dmg} <small>${pct(h.dmg / m.max)}</small></span>
        <span class="bar mini"><i style="width:${f * 100}%;background:${hpCol(f)}"></i></span>` : ''}${h.heal ? `<span class="dmg" style="color:var(--good)">+${h.heal}</span>` : ''}${
        h.out !== 'hit' ? `<span class="badge">${OUT[h.out] || esc(h.out)}${h.why ? ' &middot; ' + esc(h.why) : ''}</span>` : ''}${
        h.crit ? '<span class="badge crit">crit</span>' : ''}${h.ko ? '<span class="badge ko">KO</span>' : ''}</span>`;
    }).join('') + tags(st.self.map(e => `${e.dmg ? '−' + e.dmg : '+' + e.heal} ${e.why}`)) + tags(st.notes);
  } else if (st.k === 'switch') {
    body = st.out != null ? `${c([st.side, st.out], S)}<span class="tag">&#8644;</span>${c([st.side, st.in])}<span class="tag">${st.replace ? 'replaces the fainted Pokémon' : 'switched in'}</span>`
      : `${c([st.side, st.in])}<span class="tag">sent in</span>`;
  } else if (st.k === 'ability') {
    body = `${st.mon ? c(st.mon) : ''}<span class="mv" style="--ty:var(--muted)">${esc(title(st.ability))}</span><span class="tag">&rarr;</span>${
      st.boosts.map(([mon, s, v]) => `<span class="target">${mini(mon)}<span class="bs ${v > 0 ? 'up' : ''}">${boostTxt(s, v)}</span></span>`).join('')}${
      st.blocked.map(mon => `<span class="target">${mini(mon)}<span class="badge">Blocked</span></span>`).join('')}`;
  } else if (st.k === 'faint') {
    body = `${c(st.mon)}<span class="badge ko">fainted</span>`; cls += ' faint';
  } else if (st.k === 'cant') {
    body = `${c(st.mon)}<span class="tag">couldn't move${st.why ? ' &middot; ' + esc(st.why) : ''}</span>`;
  } else if (st.k === 'residual') {
    body = `${c(st.mon)}${st.dmg ? `<span class="dmg">&minus;${st.dmg}</span>` : `<span class="dmg" style="color:var(--good)">+${st.heal}</span>`}${st.why ? `<span class="tag">${esc(st.why)}</span>` : ''}`;
  } else {
    body = `${st.mon ? mini(st.mon) : ''}<span class="tag">${esc(st.text)}</span>`; cls += ' note';
  }
  return `<div class="step ${cls}" data-i="${i}"><span class="num">${i + 1}</span>${body}</div>`;
}

// a turn player: the field, its controls and the synced step list, inside `box`. The page has one ("How we got
// here") and the pairing preview another.
let SPEED = +(localStorage.getItem('exploreAnimSpeed') || 1);
function setSpeed(v) {
  SPEED = v; localStorage.setItem('exploreAnimSpeed', v);
  document.querySelectorAll('.speeds button').forEach(b => b.classList.toggle('on', +b.dataset.v === v));
}
class Player {
  // node: {before, steps}; ends: the names of the states the turn starts from and leads to
  constructor(box, node, ends, autoplay) {
    const T = this.T = prepTurn(node);
    Object.assign(this, {box, ends, t: 0, playing: false, stopAt: null, last: 0, field: null});
    if (!T.steps.length) { box.innerHTML = '<p class="tag">Nothing happened this turn.</p>'; return; }
    box.innerHTML = `<div class="anim"><div><div class="fieldbox"></div>
      <div class="player">
        <button class="ctl" data-a="first" title="${ends[0]}">&#9198;</button>
        <button class="ctl" data-a="back" title="previous step (&larr;)">&#9664;&#9664;</button>
        <button class="ctl play" data-a="play" title="play / pause (space)">&#9654;</button>
        <button class="ctl" data-a="fwd" title="play the next step (&rarr;)">&#9654;&#9654;</button>
        <button class="ctl" data-a="last" title="${ends[1]}">&#9197;</button>
        <span class="ends">${ends[0].slice(6)}</span><div class="scrub">${T.steps.map((st, i) =>
          `<div class="sg ${SIDE[stepSide(st)]}" style="flex:${T.dur[i]}"><i></i><span>${i + 1}</span></div>`).join('')}</div><span class="ends">${ends[1].slice(6)}</span>
        <span class="pos"></span>
        <span class="speeds">${[.5, 1, 2].map(v => `<button data-v="${v}" class="${v === SPEED ? 'on' : ''}">${v}&times;</button>`).join('')}</span>
      </div></div>
      <div class="steps steplist">${T.steps.map((st, i) => stepRow(T, st, i)).join('')}</div></div>`;
    this.field = new Field(box.querySelector('.fieldbox'));
    const act = {first: () => this.seek(0), back: () => this.back(), play: () => this.toggle(), fwd: () => this.fwd(), last: () => this.seek(T.total)};
    box.querySelectorAll('[data-a]').forEach(b => { b.onclick = () => act[b.dataset.a](); });
    box.querySelectorAll('.speeds button').forEach(b => { b.onclick = () => setSpeed(+b.dataset.v); });
    box.querySelectorAll('.steplist .step').forEach(e => { e.onclick = () => this.step(+e.dataset.i); });
    const scrub = box.querySelector('.scrub'), at = e => { const r = scrub.getBoundingClientRect(); this.seek(clamp((e.clientX - r.left) / r.width) * T.total); };
    scrub.onpointerdown = e => { scrub.setPointerCapture(e.pointerId); at(e); };
    scrub.onpointermove = e => { if (scrub.hasPointerCapture(e.pointerId)) at(e); };
    this.tickFn = now => this.tick(now);
    if (autoplay) this.play();
    else { this.t = T.total; this.draw(); }                       // show where the turn ended
  }
  draw() {
    if (!this.field) return;
    const T = this.T, box = this.box, {k, p} = locate(T, this.t), P = pose(T, k, p);
    this.field.frame(T, k, p, P, this.t, this.ends);
    box.querySelectorAll('.steplist .step').forEach((e, i) => {
      e.classList.toggle('cur', this.t > 0 && i === k);
      e.classList.toggle('future', this.t === 0 || i > k);
    });
    box.querySelectorAll('.scrub .sg i').forEach((e, i) => { e.style.width = seg(this.t, T.start[i], T.start[i] + T.dur[i]) * 100 + '%'; });
    box.querySelector('.pos').textContent = this.t <= 0 ? this.ends[0] : this.t >= T.total ? this.ends[1] : `step ${k + 1} of ${T.steps.length}`;
    box.querySelector('[data-a="play"]').innerHTML = this.playing ? '&#10074;&#10074;' : '&#9654;';
  }
  tick(now) {
    if (!this.playing) return;
    this.t = Math.min(this.T.total, this.t + Math.min(64, now - this.last) * SPEED); this.last = now;
    if (this.stopAt != null && this.t >= this.stopAt) { this.t = this.stopAt; this.playing = false; this.stopAt = null; }
    if (this.t >= this.T.total) this.playing = false;
    this.draw();
    if (this.playing) requestAnimationFrame(this.tickFn);
  }
  play(until = null) {
    if (!this.field) return;
    if (this.t >= this.T.total && until == null) this.t = 0;
    this.stopAt = until; this.playing = true; this.last = performance.now(); requestAnimationFrame(this.tickFn); this.draw();
  }
  stop() { this.playing = false; this.stopAt = null; }

  toggle() { this.playing ? this.pause() : this.play(); }
  seek(x) { this.stop(); this.t = clamp(x, 0, this.T.total); this.draw(); }
  bounds() { return [0, ...this.T.start.map((s, i) => s + this.T.dur[i])]; }
  back() { this.seek(Math.max(0, ...this.bounds().filter(b => b < this.t - 1))); }
  fwd() { const b = this.bounds().find(b => b > this.t + 1); if (b != null) { this.stop(); this.play(b); } }

}

// the page's player, rebuilt only when the state shown (or its roll) changes
const PAGE = {key: null, player: null};
function buildAnim(node, key) {
  PAGE.key = key;
  if (PAGE.player) PAGE.player.stop();
  PAGE.player = null;
  if (key == null) { $('#anim').innerHTML = ''; return; }
  $('#anim').innerHTML = `<div class="card"><h2>How we got here &middot; turn ${node.turn} from ${stateName(node.parent)}</h2>
    <div class="explore-bar"><span class="tag">${pairText(node.via)} &middot; roll seed ${node.seed}</span>
      <button id="reroll" onclick="reroll()">Re-roll this turn</button></div>
    <div class="turnbox"></div>
    <details><summary>raw battle log</summary><pre class="log">${esc(node.log.join('\n'))}</pre></details></div>`;
  PAGE.player = new Player($('#anim .turnbox'), node, [stateName(node.parent), stateName(cur)], node.autoplay);
  node.autoplay = false;                                          // watched once; revisits show where it ended
}

// ---- the pairing preview: a grid cell played out in a window; "Go to" makes it the next state ----
let PV = null;          // {from (node index), i, j, key, via, s (a /api/step result), child (s is that child's roll), busy, err, player}
const asStep = n => ({state: n.state, before: n.before, after: n.board, steps: n.steps, log: n.log, winner: n.winner, turn: n.turn, seed: n.seed});
function openPreview(i, j) {
  const node = nodes[cur], T = node.analysis, key = `${i},${j}`;
  PV = {from: cur, i, j, key, s: null, child: false, busy: false, err: '', player: null,
        via: {i, j, rowCombo: T.options[i].combo, colCombo: T.table.cols[j].combo, row: T.options[i].choices, col: T.table.cols[j].choices}};
  $('#preview').showModal();
  if (key in node.children) { PV.s = asStep(nodes[node.children[key]]); PV.child = true; renderPreview(true); }
  else previewRoll();
}
async function previewRoll() {
  const pv = PV;
  pv.busy = true; pv.err = ''; renderPreview(false);
  try {
    const s = await api('/api/step', {state: nodes[pv.from].state, row: pv.via.row, col: pv.via.col, seed: newSeed()});
    if (PV === pv) Object.assign(pv, {s, child: false});
  } catch (e) { pv.err = e.message; }
  pv.busy = false;
  if (PV === pv) renderPreview(true);
}
function renderPreview(rebuild) {
  const pv = PV, node = nodes[pv.from], T = node.analysis, ends = [stateName(pv.from), `State ${node.turn + 1}`];
  const v = T.table.cells[pv.i][pv.j], n = T.table.tries[pv.i][pv.j];
  $('#pv-title').innerHTML = `${ends[0]} &rarr; ${ends[1]} &middot; ${pairText(pv.via)}`;
  $('#pv-sub').innerHTML = n ? `MCTS's average result for this pair over ${n} simulated game${n > 1 ? 's' : ''}: ${val(v)} &middot; ${favours(v)}.
      This is one roll of its luck (damage, crits, misses); re-roll to see others.`
    : 'MCTS never tried this pair, so its cell only holds the position\'s average. This is one roll of how it plays out.';
  $('#pv-seed').textContent = pv.busy ? 'Playing the turn…' : pv.s ? `roll seed ${pv.s.seed}${pv.s.winner != null ? ' · ends the game' : ''}` : '';
  $('#pv-err').textContent = pv.err;
  $('#pv-reroll').disabled = pv.busy;
  $('#pv-go').disabled = pv.busy || !pv.s;
  $('#pv-go').innerHTML = `Go to ${ends[1]} &rarr;`;

  }
}
function previewGo() {
  const pv = PV, node = nodes[pv.from], k = node.children[pv.key];
  node.next = [pv.i, pv.j];
  if (k != null && pv.child) cur = k;
  else if (k != null) { Object.assign(nodes[k], fromStep(pv.s, pv.from, pv.via), {autoplay: false}); cur = k; }   // a new roll replaces the old one (and its analysis)
  else { nodes.push({...fromStep(pv.s, pv.from, pv.via), autoplay: false}); node.children[pv.key] = nodes.length - 1; cur = nodes.length - 1; }
  $('#preview').close();
  render();
}

addEventListener('keydown', e => {
  const p = $('#preview').open ? PV && PV.player : PAGE.player;
  if ($('#ed').open || !p || !p.field || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === ' ') { e.preventDefault(); p.toggle(); }
  else if (e.key === 'ArrowLeft') p.back();
  else if (e.key === 'ArrowRight') p.fwd();
});

// ---- explorer: click a pairing to play it, Analyze the state it leads to (served by server.py) ----
// Each node: {state (engine snapshot), board, before, steps, log, winner, turn, analysis, parent, seed,
// via: the pair that led here {i, j, rowCombo, colCombo, row, col (engine choices)} or the edit {edit: [what changed]},
// children: {"i,j": node index}, next: [i, j] of the child last opened}. The server keeps nothing.
const nodes = [];
let cur = 0, busy = '', note = '';
async function api(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const out = await r.json();
  if (!r.ok) throw new Error(out.error || r.statusText);
  Object.assign(D.sprites, out.sprites || {});
  return out;
}
async function run(label, f) {
  busy = label; note = ''; render();
  try { await f(); } catch (e) { note = e.message; }
  busy = ''; render();
}
const newSeed = () => Math.floor(Math.random() * 2 ** 31);
let ROLLS = 0;                   // a fresh turn (played or re-rolled) gets a new roll id and autoplays once
const fromStep = (s, parent, via) => ({state: s.state, board: s.after, before: s.before, steps: s.steps, log: s.log,
  winner: s.winner, turn: s.turn, seed: s.seed, analysis: null, parent, via, children: {}, next: null,
  roll: ++ROLLS, autoplay: true});
function reroll() {
  const node = nodes[cur], parent = nodes[node.parent];
  run('Re-rolling…', async () => {
    const s = await api('/api/step', {state: parent.state, row: node.via.row, col: node.via.col, seed: newSeed()});
    Object.assign(node, fromStep(s, node.parent, node.via));        // its analysis and children belonged to the old roll
  });
}
function analyze() {
  const node = nodes[cur], budget = Math.max(.2, +($('#budget') ? $('#budget').value : D.budget) || D.budget);
  run(`Analyzing (${budget} s)…`, async () => {
    node.analysis = await api('/api/analyze', {state: node.state, budget});
    node.next = null; node.pin = null; node.children = {};          // a new analysis can order its options differently
  });
}
const pathTo = k => (k < 0 ? [] : [...pathTo(nodes[k].parent), k]);

    const u = U(ED.m.species).natures, all = [...Object.keys(NATURES), 'hardy', 'docile', 'serious', 'bashful', 'quirky'];
    return `<label class="tag">Nature <select onchange="edNature(this.value)">${[...Object.keys(u), ...all.filter(n => !(n in u)).sort()].map(n =>
      `<option value="${n}" ${n === ED.m.set.nature ? 'selected' : ''}>${natTxt(n)}${u[n] ? ` (${Math.round(u[n] * 100)}%)` : ''}</option>`).join('')}</select></label>`;
  }
  const q = `<input class="q" placeholder="Search…" autocomplete="off" spellcheck="false" value="${esc(ED.q)}">`;
  if (ED.sel !== 'move') return q + (ED.sel === 'ability' ? '' : sortSeg);
  const types = [...new Set(SP[ED.m.species].learn.filter(okMove).map(id => MOVES[id].type))].sort();
  return `${q}${sortSeg}<span class="seg">${['physical', 'special', 'status'].map(c => `<button class="${ED.cat === c ? 'on' : ''}" data-cat="${c}">${CAT[c]}</button>`).join('')}</span>
    <span class="tys ${ED.type ? 'picked' : ''}">${types.map(t => `<button class="${ED.type === t ? 'on' : ''}" data-type="${t}" title="${t}" style="--ty:${TYPE[t]}">${tyIcon(t)}</button>`).join('')}</span>`;
}
const ROLL_TIP = {species: 'a common Pokémon, with a common set', ability: 'draw an ability by usage', item: 'draw an item by usage',
                  spread: 'draw a nature and spread by usage', move: 'draw a common move for this slot'};
function renderEd() {
  const {m, o} = ED, bl = monBlockers(m), dirty = JSON.stringify(m) !== JSON.stringify(work()[ED.s][ED.i]);
  const slot = (sel, k, html, ed) => `<div class="slotb ${ED.sel === sel && (sel !== 'move' || ED.k === k) ? 'on' : ''} ${ed ? 'ed' : ''}" onclick="edSel('${sel}', ${k})">${html}
    <button class="roll" title="${ROLL_TIP[sel]}" onclick="event.stopPropagation(); edRoll('${sel}', ${k})">${DIE}</button></div>`;
  const moveSlot = (mv, k) => slot('move', k, !mv ? '<span class="none">empty: pick a move</span>' : `${moveChip(mv)}${mv.bad ? '<span class="badtag">can\'t learn</span>'
    : `<span class="pp" title="PP left">${mv.pp}/${mv.max}</span>`}`, edMark(o, m, 'move', k));
  $('#ed').innerHTML = `
    <div class="pv-head"><h2>${sprite(o.species)} ${PLAYER[ED.s]}'s ${esc(o.name)}<span class="tag">${stateName(cur)} &middot; ${o.hp}/${o.max} HP${o.active ? ' &middot; on the field' : ''}</span></h2>
      <span class="right"><button class="btn ghost sm" onclick="edRoll('set')" title="keep the Pokémon; draw its moves, ability, item, nature and spread by usage">${DIE} Common set</button>
        <button class="pv-x" onclick="$('#ed').close()" title="close (Esc)">&times;</button></span></div>
    <div class="body">
      <div class="set">
        <div class="lab">Pokémon</div>${slot('species', 0, `${sprite(m.species)}<b>${esc(m.name)}</b> ${m.types.map(typeChip).join(' ')}`, m.species !== o.species)}
        <div class="lab">Ability</div>${slot('ability', 0, esc(m.ability), edMark(o, m, 'ability'))}
        <div class="lab">Item</div>${slot('item', 0, m.item ? esc(m.item) : '<span class="none">no item</span>', edMark(o, m, 'item'))}
        <div class="lab">Nature &middot; stat points</div>${slot('spread', 0, `<span><b>${natTxt(m.set.nature)}</b> &middot; ${spTxt(m.set.sp)}</span>`, edMark(o, m, 'spread'))}
        <div class="lab">Moves</div>${[0, 1, 2, 3].map(k => moveSlot(m.moves[k], k)).join('')}
      </div>
      <div class="browse"><div class="bh">${browseHead()}</div><div class="src">${usageSrc(m.species)}</div>
        <div class="filters">${edFilters()}</div><div class="rows"></div><div class="hid" id="hid"></div></div>
    </div>
    <div class="pv-foot foot">${monChanges(o, m).map(c => `<span class="chg">${esc(c.text)}</span>`).join('') || '<span class="tag">No changes yet</span>'}
      ${bl.length ? `<span class="block">${esc(bl[0])}</span>` : ''}<span style="flex:1"></span>
      <button class="btn ghost" onclick="$('#ed').close()">Cancel</button>
      <button class="btn" onclick="edDone()" ${bl.length || !dirty ? 'disabled' : ''}>Done</button></div>`;
  const q = $('#ed .q');
  if (q) {
    q.oninput = () => { ED.q = q.value; edRows(); };
    q.onkeydown = e => navKey(e, ED, () => paintRows($('#ed .rows'), ED), edPick);
  }
  edRows();
}
function edRows() {
  const {m, q, sort, all} = ED;
  const res = {move: () => moveRows(m, ED.k, {q, cat: ED.cat, type: ED.type, sort, all}), species: () => speciesRows(m, ED.s, ED.i, {q, sort}),
               ability: () => abilityRows(m, {q, all}), item: () => itemRows(m, {q, sort, all}), spread: () => spreadRows(m)}[ED.sel]();
  ED.list = res.rows;
  ED.hi = firstOk(ED.list);
  if ($('#cnt')) $('#cnt').textContent = ED.list.filter(r => !r.off).length;
  const what = {move: 'moves', ability: 'abilities', item: 'items'}[ED.sel];
  $('#hid').innerHTML = res.hidden ? `<button onclick="ED.all = !ED.all; edRows()">${all ? 'Hide' : 'Show'} the ${res.hidden} ${what} the engine can't simulate yet</button>` : '';
  paintRows($('#ed .rows'), ED);
}
function edPick(id) {
  const {m, o} = ED;
  ({move: () => opMove(m, o, ED.k, id), species: () => opSpecies(m, o, id), ability: () => opAbility(m, o, id), item: () => opItem(m, o, id),
    spread: () => opSpread(m, o, m.set.nature, id)})[ED.sel]();
  const next = m.moves.findIndex(mv => !mv || mv.bad);          // lead the way to an empty slot or a move it can't learn any more
  if (next >= 0 && (ED.sel === 'move' || ED.sel === 'species')) Object.assign(ED, {sel: 'move', k: next});
  Object.assign(ED, {q: '', cat: '', type: '', all: false});
  renderEd(); edFocus();
}
function edNature(n) { opSpread(ED.m, ED.o, n, ED.m.set.sp); renderEd(); }
function edRoll(kind, k) {
  const {m, o} = ED, sp = m.species;
  if (kind === 'set') opSet(m, o, commonSet(sp));
  else if (kind === 'species') { const to = sampleSpecies([...work()[ED.s].filter((_, j) => j !== ED.i).map(x => x.species), sp]); if (to) opSet(m, o, commonSet(to)); }
  else if (kind === 'move') {
    const id = pickW(movePool(sp, m.moves.filter(Boolean).map(x => x.id)));
    if (id) opMove(m, o, k, id);
    Object.assign(ED, {sel: 'move', k});
  } else {
    if (kind === 'ability') opAbility(m, o, bestAbility(sp, true));
    else if (kind === 'item') opItem(m, o, sampleItem(sp));
    else { const x = sampleSpread(sp); opSpread(m, o, x.nature, x.sp); }
    ED.sel = kind;
  }
  renderEd();
}
function edDone() { const {s, i, m} = ED; $('#ed').close(); edit(s, i, mm => Object.assign(mm, clone(m))); }
$('#ed').addEventListener('click', e => {
  const r = e.target.closest('.rows .row'), f = e.target.closest('[data-cat], [data-type], [data-sort]');
  if (r && !r.classList.contains('off')) return edPick(r.dataset.id);
  if (!f) return;
  if (f.dataset.cat) ED.cat = ED.cat === f.dataset.cat ? '' : f.dataset.cat;
  if (f.dataset.type) ED.type = ED.type === f.dataset.type ? '' : f.dataset.type;
  if (f.dataset.sort) ED.sort = f.dataset.sort;
  renderEd(); edFocus();
});
document.addEventListener('click', e => {
  const card = e.target.closest('.mon-card.click');
  if (!card || $('#ed').open || busy) return;
  const part = e.target.closest('[data-part]');
  openEd(+card.dataset.s, +card.dataset.i, part && part.dataset.part, part ? +part.dataset.k || 0 : 0);
});

const render = () => { renderExplore(); drawWires(); sizeHybrid(); };
addEventListener('resize', () => { drawWires(); sizeHybrid(); [PAGE.player, PV && PV.player].forEach(p => p && p.relayout()); });
$('#preview').addEventListener('close', () => { if (PV && PV.player) PV.player.stop(); PV = null; });
nodes.push({...D.start, analysis: null, parent: -1, via: null, seed: null, children: {}, next: null});
render();
</script>
