<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champions Play — turn tabs + log gutter (mockup)</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1c1c1a; --mute:#6b6b66; --line:#d9d9d3; --acc:#2a5bd7; --p1:#2a5bd7; --p2:#c0392b;
          --hp-hi:#2e9d5b; --hp-mid:#d9a21b; --hp-lo:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#1f1f1d; --ink:#ececE8; --mute:#9a9a93; --line:#34342f; --acc:#6f95ff; --p1:#6f95ff; --p2:#ff7a6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui, sans-serif; }
  main { max-width:1240px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  h2 { font-size:15px; margin:16px 0 8px; }
  button, select, input { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  button { cursor:pointer; } button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px; }
  .sides { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width:700px) { .sides { grid-template-columns:1fr; } }
  .p1 h2 { color:var(--p1); } .p2 h2 { color:var(--p2); }
  .p1 { --side:var(--p1); } .p2 { --side:var(--p2); }
  .slot { display:grid; grid-template-columns:44px 1fr; background:var(--card); border:1px solid var(--line); border-left:6px solid var(--side);
          border-radius:10px; overflow:hidden; margin-bottom:8px; }
  .slot.empty { display:block; padding:10px; color:var(--mute); border-style:dashed; } .slot.fainted { opacity:.5; filter:grayscale(.8); }
  .slot.actor { outline:2px solid var(--acc); } .slot.target { outline:2px dashed var(--p2); }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:4px 0; }
  .bar > i { display:block; height:100%; background:var(--hp-hi); } .bar > i.mid { background:var(--hp-mid); } .bar > i.lo { background:var(--hp-lo); }
  .mute { color:var(--mute); } .tag { font-size:12px; border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-right:4px; }
  .err { color:var(--p2); min-height:1.4em; } .log { max-height:220px; overflow:auto; font-size:13px; }
  .log div.on { font-weight:600; color:var(--acc); }
  .hidden { display:none; }
  /* orders rail: the only place actions live; cards above only show state */
  .field { display:grid; gap:4px; } .field .cards { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; } .field .slot { margin-bottom:0; }
  @media (max-width:700px) { .field .cards { grid-template-columns:1fr; } }
  .split { display:grid; grid-template-columns:1fr 340px; gap:12px; align-items:start; } @media (max-width:900px) { .split { grid-template-columns:1fr; } }
  .rail { position:sticky; top:12px; display:grid; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .rail h3 { margin:0; font-size:14px; } .rail .side-lbl { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--side); margin-top:2px; }
  .order { border:1px solid var(--line); border-left:5px solid var(--side); border-radius:8px; padding:7px 9px; }
  .order.open { border-color:var(--acc); border-left-color:var(--side); } .order .top { display:flex; align-items:center; gap:6px; font-weight:700; cursor:pointer; }
  .order .top .tick { margin-left:auto; color:var(--hp-hi); font-weight:800; } .order .sum { font-size:13px; color:var(--mute); margin-top:2px; cursor:pointer; } .order .sum b { color:var(--ink); }
  .lbl { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--mute); margin:8px 0 4px; }
  .opt { display:flex; align-items:center; gap:8px; width:100%; margin-top:5px; text-align:left; } .opt .tagr { font-size:11px; color:var(--mute); }
  .opt .mini { margin-left:auto; width:70px; } .opt .mini .bar { height:7px; margin:0; } .opt.p1 { border-color:var(--p1); } .opt.p2 { border-color:var(--p2); }
  .chips2 { display:flex; flex-wrap:wrap; gap:6px; }
  .rail .btnrow { display:flex; gap:8px; } .rail .btnrow .primary { flex:1; }
  /* type badges: one colour per type, shared by setup and battle screens */
  .ti { width:22px; height:22px; flex:none; vertical-align:middle; }
  /* setup: one card per Pokémon, labelled fields on a fixed grid */
  .mon-card { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; }
  .mon-head { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .mon-head .species { flex:1; min-width:0; font-weight:600; }
  .mon-head .types { display:flex; gap:4px; }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:6px 8px; margin-bottom:8px; }
  .field { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .field > span { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); }
  .field select, .field input { width:100%; }
  .field.invalid input { border-color:var(--p2); }
  .moves-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 8px; }
  .moves-grid select { width:100%; border-left:4px solid var(--t, var(--line)); }
  /* battle card: type icons in a left gutter, then name, HP, status/stages, item and ability, moves */
  .gutter { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:8px 0; background:var(--bg); border-right:1px solid var(--line); }
  .gutter .ti { width:28px; height:28px; }
  .slot .body { padding:12px; min-width:0; }
  .slot .head { display:flex; align-items:baseline; gap:8px; } .slot .name { font-weight:700; font-size:17px; }
  .slot .pct { margin-left:auto; font-size:26px; font-weight:800; line-height:1; text-align:right; } .slot .pct small { display:block; font-size:12px; font-weight:500; color:var(--mute); margin-top:2px; }
  .slot .bar { height:14px; border-radius:7px; margin:10px 0 8px; } .slot .bar > i { transition:width .3s; }
  .slot.targeted { outline:2px dashed var(--p2); } .slot.acting { outline:2px solid var(--acc); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; min-height:4px; } .chips + .chips { margin-top:8px; }
  .pill { display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600; border:1px solid var(--line); border-radius:999px; padding:2px 9px; background:var(--bg); white-space:nowrap; }
  .pill small { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); }
  .stage { font-size:12px; font-weight:800; border-radius:4px; padding:1px 7px; border:1.5px solid; } .stage.up { color:var(--hp-hi); } .stage.down { color:var(--hp-lo); }
  .status { font-size:12px; font-weight:800; color:#fff; border-radius:4px; padding:1px 7px; background:#d4a017; text-transform:uppercase; }
  .dmg { margin-left:auto; font-weight:800; color:var(--hp-lo); }
  .moves { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
  .mv { display:flex; align-items:center; gap:7px; text-align:left; font-weight:600; padding:4px 8px 4px 5px; border-radius:8px; white-space:nowrap;
        background:color-mix(in srgb, var(--t) 14%, var(--card)); border:1px solid color-mix(in srgb, var(--t) 40%, var(--line)); }
  .moves.ro { margin-top:10px; gap:5px; } .mv.ro { font-size:12.6px; padding:3px 7px 3px 4px; gap:6px; } .mv.ro .ti { width:18px; height:18px; }
  .mv em { margin-left:auto; font-style:normal; font-size:11px; color:var(--mute); }
  .mv.sel { outline:2px solid var(--acc); }
  .log h3 { font-size:13px; margin:0 0 4px; } .log .p1 { color:var(--p1); font-weight:600; } .log .p2 { color:var(--p2); font-weight:600; }
  .banner { font-size:18px; font-weight:700; text-align:center; padding:10px; border-radius:8px; margin-bottom:12px; color:#fff; background:var(--acc); }
  .setup-bar { position:sticky; top:0; z-index:1; background:var(--card); padding-bottom:8px; }

  /* --- spike: A3 turn tabs + whole-battle log in the right gutter --- */
  .tabs { display:flex; gap:6px; align-items:flex-end; padding-left:4px; }
  .tabs .t { border:1px solid var(--line); border-bottom:none; background:var(--bg); color:var(--mute); border-radius:10px 10px 0 0; padding:6px 16px 8px; font-weight:700; min-width:52px; }
  .tabs .t.on { background:var(--card); color:var(--ink); border-color:var(--acc); margin-bottom:-1px; padding-top:9px; position:relative; z-index:1; }
  .tabs .t.next { border-style:dashed; border-bottom:none; }
  .tabs button:not(.t) { margin-bottom:6px; }
  .panel { background:var(--card); border:1px solid var(--acc); border-radius:0 10px 10px 10px; padding:12px; }
  .gutter-col { position:sticky; top:12px; display:flex; flex-direction:column; gap:8px; max-height:calc(100vh - 24px); }
  .gutter-col .rail { position:static; flex:none; }
  #battle-log { flex:1; min-height:160px; max-height:none; overflow:auto; margin:0; position:relative; }
  #battle-log .turnblk.on { font-weight:400; color:var(--ink); }
  #battle-log h3 { position:sticky; top:-12px; background:var(--card); padding:12px 0 6px; margin:-12px 0 0; z-index:2; }
  .turnblk { border-left:3px solid var(--line); padding:3px 0 4px 10px; margin:0 0 8px; cursor:pointer; border-radius:0 6px 6px 0; opacity:.62; }
  .turnblk.on { border-color:var(--acc); background:color-mix(in srgb, var(--acc) 9%, transparent); opacity:1; }
  .turnblk .th { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--mute); }
  .turnblk .th .tag { text-transform:none; letter-spacing:0; margin-left:6px; }
  .turnblk .ln { padding:1px 4px; margin-left:-4px; border-radius:4px; font-size:13px; }
  .turnblk .ln.on { background:var(--acc); color:#fff; font-weight:600; } .turnblk .ln.on span { color:#fff; }
</style>
</head>
<body>
<main>
  <h1>Champions Play</h1>
  <div id="err" class="err" role="alert"></div>
  <section id="setup" class="card hidden"></section>
  <section id="game" class="hidden"></section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e[k] = v;
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function fail(e) { $("err").textContent = e.message || String(e); }

let dex = null, view = null, frameIdx = null, teams = {p1: [], p2: []}, active = 2, picks = {};

function option(value, label, selected) { const o = el("option", {value}, label ?? value); o.selected = !!selected; return o; }
function select(options, value, onchange) { const s = el("select", {onchange}, options.map(([v, l]) => option(v, l, v === value))); return s; }

const TYPE_COLORS = {bug:"#a09f28", grass:"#439a3b", fairy:"#e28ce1", normal:"#828283", dragon:"#576fc0", psychic:"#e96c8f", ghost:"#714470", ground:"#a3743c",
  steel:"#6bacc8", fire:"#e4613e", flying:"#74acd2", ice:"#49c8c9", electric:"#e0bc2d", rock:"#a9a581", dark:"#4e4747", water:"#329ae3", fighting:"#e69123", poison:"#9454cc"};
const typeColor = (t) => TYPE_COLORS[String(t).toLowerCase()] || "#777";
const typeIcon = (t) => el("img", {class: "ti", src: `../../../src/champions/play/static/icons/${String(t).toLowerCase()}.png`, alt: t, title: t});
const STAGE_ABBR = {attack: "Atk", defense: "Def", "special-attack": "SpA", "special-defense": "SpD", speed: "Spe"};
const pretty = (slug) => slug.split("-").map((w) => w[0].toUpperCase() + w.slice(1)).join(" ");  // froslass-mega -> Froslass Mega
let scenarios = [], pickedScenario = null;  // battle tests loadable from a source checkout (empty otherwise)
function field(label, control, cls) { return el("label", {class: "field" + (cls ? " " + cls : "")}, el("span", {}, label), control); }

// ---- setup ------------------------------------------------------------------------------------------------
function blankMon(side) {
  const names = Object.keys(dex.species), species = names[Math.floor(Math.random() * names.length)];
  return {species, moves: dex.species[species].moves.slice(0, 4), item: "", nature: "hardy"};
}
function renderSetup() {
  const box = $("setup"); box.replaceChildren();
  box.append(el("datalist", {id: "species-list"}, Object.keys(dex.species).sort().map((id) => option(pretty(id), id))));
  box.append(el("div", {class: "row setup-bar"},
    field("Format", select([["1", "Singles"], ["2", "Doubles"]], String(active), (e) => { active = +e.target.value; })),
    el("span", {style: "flex:1"}),
    el("button", {onclick: () => { teams = {p1: [], p2: []}; fillTeams(); renderSetup(); }}, "Randomize teams"),
    el("button", {class: "primary", onclick: start}, "Start battle")));
  if (scenarios.length) {
    const groups = [...new Set(scenarios.map((x) => x.group))];
    const pick = el("select", {onchange: (e) => { pickedScenario = e.target.value; }}, groups.map((g) =>
      el("optgroup", {label: g}, scenarios.filter((x) => x.group === g).map((x) => option(x.id, x.name, x.id === pickedScenario)))));
    pickedScenario = pickedScenario || pick.value;
    box.append(el("div", {class: "row setup-bar"}, field("Battle test", pick),
      el("button", {onclick: () => loadScenario(pickedScenario)}, "Load test")));
  }
  const sides = el("div", {class: "sides"});
  for (const side of ["p1", "p2"]) {
    const col = el("div", {class: side}, el("h2", {}, side === "p1" ? "Player 1" : "Player 2"));
    teams[side].forEach((m, i) => col.append(monEditor(side, m, i)));
    col.append(el("button", {disabled: teams[side].length >= 6, onclick: () => { teams[side].push(blankMon(side)); renderSetup(); }}, "+ Pokémon"));
    sides.append(col);
  }
  box.append(sides);
}
function monEditor(side, m, i) {
  const byLabel = (text) => {
    const t = text.trim().toLowerCase();
    return Object.keys(dex.species).find((id) => id === t || pretty(id).toLowerCase() === t);
  };
  const card = el("div", {class: "mon-card"});
  const types = el("span", {class: "types"}, dex.species[m.species].types.map(typeIcon));
  const input = el("input", {class: "species", value: pretty(m.species), placeholder: "Species", autocomplete: "off",
    onchange: (e) => {
      const id = byLabel(e.target.value);
      if (!id) { e.target.parentElement.classList.add("invalid"); return; }
      if (id !== m.species) { m.species = id; m.moves = dex.species[id].moves.slice(0, 4); }
      renderSetup();
    }});
  input.setAttribute("list", "species-list");
  input.addEventListener("focus", () => input.select());
  card.append(el("div", {class: "mon-head"}, el("label", {class: "field", style: "flex:1"}, el("span", {}, `Pokémon ${i + 1}`), input), types,
    el("button", {title: "Remove", disabled: teams[side].length <= 1, onclick: () => { teams[side].splice(i, 1); renderSetup(); }}, "✕")));
  card.append(el("div", {class: "fields"},
    field("Item", select([["", "(no item)"], ...dex.items.map((x) => [x, pretty(x)])], m.item, (e) => { m.item = e.target.value; })),
    field("Nature", select(dex.natures.map((x) => [x, pretty(x)]), m.nature, (e) => { m.nature = e.target.value; }))));
  const moveIds = dex.species[m.species].moves, grid = el("div", {class: "moves-grid"});
  for (let k = 0; k < 4; k++) {
    const cur = m.moves[k] || "", sel = select([["", "(empty)"], ...moveIds.map((id) => [id, dex.moves[id].name])], cur, (e) => {
      const next = m.moves.slice(); next[k] = e.target.value; m.moves = next.filter(Boolean);
      renderSetup();
    });
    if (cur) sel.style.setProperty("--t", typeColor(dex.moves[cur].type));
    grid.append(field(`Move ${k + 1}`, sel));
  }
  card.append(grid);
  return card;
}
function fillTeams() { for (const side of ["p1", "p2"]) while (teams[side].length < 4) teams[side].push(blankMon(side)); }
async function start() {
  $("err").textContent = "";
  const spec = (m) => { const s = {species: m.species, moves: m.moves}; if (m.item) s.item = m.item; if (m.nature !== "hardy") s.nature = m.nature; return s; };
  try {
    view = await api("/api/new", {teams: {p1: teams.p1.map(spec), p2: teams.p2.map(spec)}, active});
    frameIdx = null; picks = {}; openSlot = null;
    show();
  } catch (e) { fail(e); }
}

async function loadScenario(id) {
  $("err").textContent = "";
  try { view = await api("/api/scenario", {id}); frameIdx = null; picks = {}; openSlot = null; show(); } catch (e) { fail(e); }
}

// ---- battle -----------------------------------------------------------------------------------------------

let openSlot = null, cursor = 3, selTurn = 2, selFrame = null;  // cursor: turns played so far; selTurn: tab being viewed (null = live)

    box.append(el("div", {class: "lbl"}, "Target"), ...mv.targets.map((t) => {
      const m = mon(t), pct = Math.round(100 * m.hp / m.max_hp);
      return el("button", {class: `opt ${sideOf(t)}` + (p.target === t ? " sel" : ""), onclick: () => { picks[slot].target = t; advance(slot); }},
        pretty(m.species), sideOf(t) === sideOf(slot) ? el("span", {class: "tagr"}, "ally") : null,
        el("span", {class: "mini"}, el("div", {class: "bar"}, el("i", {class: pct < 25 ? "lo" : pct < 50 ? "mid" : "", style: `width:${pct}%`}))));
    }));
  }
  if (legal.switches.length) {
    box.append(el("div", {class: "lbl"}, "Switch"), el("div", {class: "chips2"}, legal.switches.map((i) => el("button", {
      class: p.kind === "switch:" + i ? "sel" : "", onclick: () => choose(slot, "switch:" + i)},
      pretty(view.snapshot.bench[sideOf(slot)].find((b) => b.index === i).species)))));
  }
  return box;
}
function rail(live, canAct, slots) {
  const box = el("div", {class: "rail"});
  if (view.winner) { box.append(el("h3", {}, "Battle over")); return box; }
  if (!live) {
    box.append(el("h3", {}, playing ? "Playing turn…" : "Viewing an earlier step"),
      el("button", {class: "primary", onclick: () => { clearInterval(timer); playing = false; frameIdx = null; show(); }}, playing ? "Skip to end" : "Back to live"));
    return box;
  }
  if (view.pending.length) {
    box.append(el("h3", {}, "Choose replacements"));
    const chosen = {};
    for (const slot of view.pending) {
      const bench = view.snapshot.bench[sideOf(slot)];
      chosen[slot] = bench[0].index;
      box.append(el("div", {class: "row"}, `${slot}:`, select(bench.map((b) => [String(b.index), `${pretty(b.species)} ${b.hp}/${b.max_hp}`]), String(chosen[slot]), (e) => { chosen[slot] = +e.target.value; })));
    }
    box.append(el("button", {class: "primary", onclick: () => act(() => api("/api/replace", {replacements: chosen}))}, "Send in"));
    return box;
  }
  box.append(el("h3", {}, `Orders · Turn ${view.snapshot.turn + 1}`));
  let lastSide = null;
  for (const slot of slots) {
    if (sideOf(slot) !== lastSide) { lastSide = sideOf(slot); box.append(el("div", {class: `side-lbl ${lastSide}`}, lastSide === "p1" ? "Player 1" : "Player 2")); }
    const m = mon(slot), isOpen = openSlot === slot;
    const order = el("div", {class: `order ${sideOf(slot)}` + (isOpen ? " open" : "")},
      el("div", {class: "top", onclick: () => { openSlot = slot; show(); }}, m.types.map(typeIcon), pretty(m.species), el("span", {class: "mute", style: "font-weight:400"}, slot),
        ready(slot) ? el("span", {class: "tick"}, "✓") : null),
      el("div", {class: "sum", onclick: () => { openSlot = slot; show(); }}, summary(slot)));
    if (isOpen) order.append(movePicker(slot, view.legal[slot]));
    box.append(order);
  }
  const done = slots.filter(ready).length;
  box.append(el("div", {class: "mute"}, `${done} of ${slots.length} ready`),
    el("div", {class: "btnrow"}, el("button", {onclick: autoFill, disabled: done === slots.length}, "Auto-fill rest"),
      el("button", {class: "primary", disabled: done !== slots.length, onclick: () => act(() => api("/api/turn", {actions: buildActions(slots)}))}, "Resolve turn")));
  return box;
}
function buildActions(slots) {
  const out = {};
  for (const slot of slots) {
    const p = picks[slot], [kind, v] = p.kind.split(":");
    out[slot] = kind === "switch" ? {switch: +v} : (p.target ? {move: v, target: p.target} : {move: v});
  }
  return out;
}

let timer = null, playing = false;
async function act(fn) {  // mockup: "Resolve turn" reveals the next recorded turn and plays its lines down the log
  $("err").textContent = "";
  if (cursor >= VIEWS.length - 1) { fail(new Error("mockup ends here: that was the last recorded turn")); return; }
  cursor++; selTurn = null; picks = {}; openSlot = null; playing = true; selFrame = 0; show();
  const n = VIEWS[cursor].frames.length;
  timer = setInterval(() => { if (selFrame >= n - 1) { clearInterval(timer); playing = false; selFrame = null; } else selFrame++; show(); }, 650);
}
(async () => { dex = DEX; view = VIEWS[cursor]; show(); })();
</script>
