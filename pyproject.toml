[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "champions"
dynamic = ["version"]
description = "Local reference data, stats, lookup and damage calculator for Pokémon Champions"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
champions = "champions.cli:main"

[tool.setuptools.dynamic]
version = { attr = "champions.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
champions = ["data/*.json", "play/static/*", "play/static/icons/*.png"]
